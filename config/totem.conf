# no USB logging (saves power)
CONFIG_ZMK_USB_LOGGING=n
# mouse keys on the NAV layer (pointer, scroll, clicks)
CONFIG_ZMK_POINTING=y
# deep sleep after 10 minutes without a key press (both halves); any key wakes the keyboard
# (that first key press is used for waking and is not typed)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
