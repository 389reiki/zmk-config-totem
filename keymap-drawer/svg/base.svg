<svg width="1728" height="840" viewBox="0 0 864 420" class="keymap" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>/* inherit to force styles through use tags */
svg path {
    fill: inherit;
}

/* font and background color specifications */
svg.keymap {
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
    font-size: 14px;
    font-kerning: normal;
    text-rendering: optimizeLegibility;
    fill: #24292e;
}

/* default key styling */
rect.key {
    fill: #f6f8fa;
}

rect.key, rect.combo {
    stroke: #c9cccf;
    stroke-width: 1;
}

/* default key side styling, only used is draw_key_sides is set */
rect.side {
    filter: brightness(90%);
}

/* color accent for combo boxes */
rect.combo, rect.combo-separate {
    fill: #cdf;
}

/* color accent for held keys */
rect.held, rect.combo.held {
    fill: #fdd;
}

/* color accent for ghost (optional) keys */
rect.ghost, rect.combo.ghost {
    stroke-dasharray: 4, 4;
    stroke-width: 2;
}

text {
    text-anchor: middle;
    dominant-baseline: middle;
}

/* styling for layer labels */
text.label {
    font-weight: bold;
    text-anchor: start;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for optional footer */
text.footer {
    text-anchor: end;
    dominant-baseline: auto;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for combo tap, and key non-tap label text */
text.combo, text.hold, text.shifted, text.left, text.right {
    font-size: 11px;
}

text.hold {
    text-anchor: middle;
    dominant-baseline: auto;
}

text.shifted {
    text-anchor: middle;
    dominant-baseline: hanging;
}

text.left {
    text-anchor: start;
}

text.right {
    text-anchor: end;
}

text.layer-activator {
    text-decoration: underline;
}

/* styling for hold/shifted label text in combo box */
text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right {
    font-size: 8px;
}

/* lighter symbol for transparent keys */
text.trans {
    fill: #7b7e81;
}

/* styling for combo dendrons */
path.combo {
    stroke-width: 1;
    stroke: gray;
    fill: none;
}

/* Start Tabler Icons Cleanup */
/* cannot use height/width with glyphs */
.icon-tabler > path {
    fill: inherit;
    stroke: inherit;
    stroke-width: 2;
}
/* hide tabler's default box */
.icon-tabler > path[stroke="none"][fill="none"] {
    visibility: hidden;
}
/* End Tabler Icons Cleanup */

@media (prefers-color-scheme: dark) {
svg.keymap { fill: #d1d6db; }
rect.key { fill: #3f4750; }
rect.key, rect.combo { stroke: #60666c; }
rect.combo, rect.combo-separate { fill: #1f3d7a; }
rect.held, rect.combo.held { fill: #854747; }
text.label, text.footer { stroke: black; }
text.trans { fill: #7e8184; }
path.combo { stroke: #7f7f7f; }

}

rect.key { stroke-width: 1; }
text { font-size: 15px; }
text.hold, text.shifted { font-size: 10px; }
rect.combo { fill: #7F77DD; fill-opacity: .35; stroke: #7F77DD; }

.layer-NAV rect.key.lay { fill: #378ADD; fill-opacity: .22; stroke: #378ADD; }
rect.key.trig-NAV { fill: #378ADD; fill-opacity: .45; stroke: #378ADD; }
rect.key.held.trig-NAV { stroke-width: 4; }

.layer-SYM rect.key.lay { fill: #1D9E75; fill-opacity: .22; stroke: #1D9E75; }
rect.key.trig-SYM { fill: #1D9E75; fill-opacity: .45; stroke: #1D9E75; }
rect.key.held.trig-SYM { stroke-width: 4; }

.layer-NUM rect.key.lay { fill: #BA7517; fill-opacity: .22; stroke: #BA7517; }
rect.key.trig-NUM { fill: #BA7517; fill-opacity: .45; stroke: #BA7517; }
rect.key.held.trig-NUM { stroke-width: 4; }

.layer-SYS rect.key.lay { fill: #888780; fill-opacity: .22; stroke: #888780; }
rect.key.trig-SYS { fill: #888780; fill-opacity: .45; stroke: #888780; }
rect.key.held.trig-SYS { stroke-width: 4; }
</style>
